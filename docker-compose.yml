# NetPulse - local / on-prem deployment
# Run:  docker compose up -d --build
services:
  netpulse:
    build: .
    container_name: netpulse
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - netpulse-data:/app/data
    # ICMP ping needs raw sockets:
    cap_add:
      - NET_RAW
    # On Linux you can alternatively use: network_mode: host

  # ---- Optional PostgreSQL (uncomment + set DATABASE_URL in .env) ----
  # db:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: netpulse
  #     POSTGRES_PASSWORD: change-me
  #     POSTGRES_DB: netpulse
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

volumes:
  netpulse-data:
  # pgdata:
