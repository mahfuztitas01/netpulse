# Render.com free-tier blueprint — deploys straight from GitHub.
#
# 1. Create a free Postgres at https://neon.tech (no card) and copy its
#    connection string (looks like postgresql://user:pass@host/db?sslmode=require)
# 2. Render -> New + -> Blueprint -> pick this repo
# 3. Paste the Neon URL into DATABASE_URL and set FIRST_ADMIN_PASSWORD
#
# Note: Render's free web service sleeps after ~15 min without traffic.
# Point a free uptime pinger (cron-job.org / UptimeRobot) at /health every
# 5 minutes to keep the monitor engine running.
services:
  - type: web
    name: netpulse
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false            # paste your Neon Postgres URL
      - key: COOKIE_SECURE
        value: "true"          # Render serves HTTPS
      - key: FIRST_ADMIN_USERNAME
        value: admin
      - key: FIRST_ADMIN_PASSWORD
        sync: false            # choose your own admin password (min 8 chars)
      - key: FIRST_ADMIN_EMAIL
        sync: false
      - key: PING_PRIVILEGED
        value: "false"         # free hosts have no raw-socket privileges
      - key: TELEGRAM_ENABLED
        value: "false"         # configure Telegram from the dashboard instead
