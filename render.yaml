# Render.com free-tier blueprint
# Deploy: push repo to GitHub -> Render -> New + -> Blueprint
services:
  - type: web
    name: netpulse
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./netpulse.db
      - key: TELEGRAM_ENABLED
        value: "false"
      - key: PING_PRIVILEGED
        value: "false"      # free hosts block raw ICMP; use tcp/http checks
      - key: PYTHON_VERSION
        value: "3.12.5"
