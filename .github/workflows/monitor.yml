name: NetPulse Monitor (30s)

# Runs on GitHub's servers, so monitoring + Telegram alerts keep working even
# when your own PC is switched off.
#
# How the 30-second resolution works: GitHub's cron is best-effort and the
# minimum interval is 5 minutes, so instead of one short run per cron tick we
# start ONE long-lived runner that loops every 30 seconds for ~5h30m. The
# `*/5` cron keeps a *pending* run queued (concurrency + cancel-in-progress:
# false), so the moment the long runner exits the next one starts and the loop
# never stops.
#
# Required secret: TELEGRAM_BOT_TOKEN
#   GitHub -> Settings -> Secrets and variables -> Actions -> New repository secret
#
# NOTE: this job is only free because the repository is public (GitHub gives
# unlimited Actions minutes to public repos; a private repo would burn the
# 2,000 min/month free allowance in ~2 days).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write # needed to commit cloud/state.json back

concurrency:
  group: netpulse-monitor
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-cloud.txt

      - name: Configure git
        run: |
          git config user.name  "netpulse-bot"
          git config user.email "netpulse-bot@users.noreply.github.com"

      - name: Run 30s monitoring loop
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          LOOP_SECONDS: "19800"
          CHECK_INTERVAL_SECONDS: "30"
          STATE_COMMIT_SECONDS: "600"
        run: python scripts/cloud_check_loop.py
