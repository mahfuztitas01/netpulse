name: NetPulse Monitor

# Runs on GitHub's servers, so monitoring + Telegram alerts keep working even
# when your own PC is switched off.
#
# Required secret: TELEGRAM_BOT_TOKEN
#   GitHub -> Settings -> Secrets and variables -> Actions -> New repository secret

on:
  schedule:
    # Every 15 minutes. GitHub's minimum is 5 minutes, but scheduled runs are
    # queued and often delayed. Shorten to "*/5 * * * *" if you make this repo
    # public (public repos get unlimited Actions minutes).
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write # needed to commit cloud/state.json back

concurrency:
  group: netpulse-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-cloud.txt

      - name: Run one monitoring round
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/cloud_check.py

      - name: Build the static dashboard
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          DASHBOARD_GH_TOKEN: ${{ secrets.DASHBOARD_GH_TOKEN }}
          CLIENT_PW_UID5001: ${{ secrets.CLIENT_PW_UID5001 }}
          CLIENT_PW_UID5002: ${{ secrets.CLIENT_PW_UID5002 }}
          CLIENT_PW_UID5003: ${{ secrets.CLIENT_PW_UID5003 }}
        run: python scripts/build_dashboard.py docs

      - name: Publish dashboard to GitHub Pages
        env:
          LINK_TOKEN: ${{ secrets.LINK_REPO_TOKEN }}
        run: |
          if [ -z "$LINK_TOKEN" ]; then
            echo "LINK_REPO_TOKEN not set - skipping dashboard publish"
            exit 0
          fi
          cd "$RUNNER_TEMP"
          git clone --depth 1 \
            "https://x-access-token:${LINK_TOKEN}@github.com/mahfuztitas01/netpulse-link.git" link
          # publish the whole docs tree (admin page + per-client pages)
          rm -f link/index.html link/.nojekyll
          rm -rf link/client
          cp -r "$GITHUB_WORKSPACE/docs/." link/
          cd link
          git config user.name  "netpulse-bot"
          git config user.email "netpulse-bot@users.noreply.github.com"
          git add -A
          if git diff --quiet --cached; then
            echo "dashboard unchanged"
          else
            git commit -m "chore: update NetPulse dashboard [skip ci]"
            git push
            echo "dashboard published -> https://mahfuztitas01.github.io/netpulse-link/"
          fi

      - name: Persist state
        run: |
          # state.json starts life untracked, so `git diff` alone would report
          # "no changes" and the file would never be committed. Stage it first.
          git add -f cloud/state.json
          if git diff --cached --quiet; then
            echo "state unchanged - nothing to commit"
            exit 0
          fi
          git config user.name  "netpulse-bot"
          git config user.email "netpulse-bot@users.noreply.github.com"
          git commit -m "chore(monitor): update state [skip ci]"
          git push
