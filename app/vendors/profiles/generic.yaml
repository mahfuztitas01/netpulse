# Generic SNMP device profile (works for most SNMP-enabled devices).
key: generic
label: Generic SNMP
description: >
  Portable defaults based on HOST-RESOURCES-MIB and IF-MIB. Use this when a
  vendor-specific profile is not available.

cpu:
  # Walk hrProcessorLoad and average the cores (percent).
  mode: walk_avg
  oid: 1.3.6.1.2.1.25.3.3.1.2

ram:
  # Walk hrStorageTable and use the hrStorageRam row: used/size * 100.
  mode: host_resources

uptime:
  oid: 1.3.6.1.2.1.1.3.0   # sysUpTime

# Standard IF-MIB interface counters (64-bit with 32-bit fallback).
interfaces:
  name_oid: 1.3.6.1.2.1.31.1.1.1.1     # ifName
  alias_oid: 1.3.6.1.2.1.31.1.1.1.18   # ifAlias
  type_oid: 1.3.6.1.2.1.2.2.1.3        # ifType
  oper_oid: 1.3.6.1.2.1.2.2.1.8        # ifOperStatus (1=up, 2=down)
  speed_oid: 1.3.6.1.2.1.31.1.1.1.15   # ifHighSpeed (Mbps)
  in_oid: 1.3.6.1.2.1.31.1.1.1.6       # ifHCInOctets
  out_oid: 1.3.6.1.2.1.31.1.1.1.10     # ifHCOutOctets
  in_oid32: 1.3.6.1.2.1.2.2.1.10       # ifInOctets (fallback)
  out_oid32: 1.3.6.1.2.1.2.2.1.16      # ifOutOctets (fallback)
